# Klipper configuration for:
#   Printer:   Creality Ender 3 (frame/rails, 220x220x250 build volume)
#   Board:     Creality / Sovol "Silent" Board V4.2.7 (STM32F103, 32-bit,
#              onboard TMC2225 drivers)
#   Probe:     BIGTREETECH CR Touch (BLTouch-compatible, on the board's
#              dedicated probe port)
#   Extruder:  BIGTREETECH Sprite Pro (direct drive, all-metal hotend)
#   Display:   BIGTREETECH TFT35 (run in Klipper/"Touch" mode)
#
# This is the same printer/peripherals as printer.cfg (the SKR Mini E3 V3
# version in this repo) but swapped onto a Creality V4.2.7-family mainboard.
# If this board is wired differently than stock (some "Sovol"/clone 4.2.7
# boards vary slightly), double check pins against your board's silkscreen
# before trusting this file.
#
# FIRMWARE: `make menuconfig` ->
#   Micro-controller Architecture = STMicroelectronics STM32
#   Processor model              = STM32F103
#   Bootloader offset            = 28KiB bootloader
#   Clock Reference              = 8 MHz crystal
#   Communication interface      = Serial (on USART1 PA10/PA9)
# This board's "USB" port is actually a CH340 USB-to-serial chip wired to
# USART1, NOT a native USB peripheral on the MCU (unlike the SKR Mini E3
# V3's STM32G0B1). That's why [mcu] below needs restart_method: command --
# Klipper can't toggle DTR through a CH340 to reset the board, so it sends
# a firmware-restart command over the serial line instead.
# Flash by copying out/klipper.bin to an SD card as a file ending in
# ".bin" (name must differ from whatever was flashed last) and power on
# with the card inserted.
#
# TMC2225 NOTE: this board does not break out the TMC2225 UART lines to
# the MCU, so there is no [tmc2225 ...] section here -- run current and
# microstepping are fixed by on-board resistors, not software-configurable.
# `microsteps: 16` below matches the board's fixed hardware setting; do not
# change it unless you've confirmed your board is wired for something else.
#
# DISPLAY: The TFT35 does not need any section in this file. Flash it with
# the "...Klipper" firmware variant (BTT calls this "Touch mode" / host
# mode) and wire it to the board's TFT/UART header. In that mode the
# screen talks to Klipper/Moonraker over the network like a hardware
# KlipperScreen, and does not sit on the printer's command serial line --
# no [display] or secondary [mcu] entry is required or correct here.
# Do NOT use Marlin mode.
#
# See docs/Config_Reference.md on klipper3d.org for a full parameter reference.

[mcu]
# Find the real path with: ls /dev/serial/by-id/*
# Typically shows up as something like usb-1a86_USB_Serial-if00-port0
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

#####################################################################
#   X/Y/Z Stepper Settings
#####################################################################

[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: !PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
# Z homes to the CR Touch instead of the physical endstop switch (PA7 is
# unused with this setup).
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250

#####################################################################
#   CR Touch (BLTouch-compatible probe)
#####################################################################
# CR Touch plugs into this board's dedicated BLTouch-style probe port.
# PB0/PB1 come from this board's own board_pins aliases (PROBE_IN/PROBE_OUT)
# in Klipper's official Creality v4.2.7 reference config.

[bltouch]
sensor_pin: ^PB0
control_pin: PB1
x_offset: -44
y_offset: -9
#z_offset: 0.0
speed: 5
samples: 2
sample_retract_dist: 3.0
stow_on_each_sample: False
# IMPORTANT: x_offset/y_offset above are placeholders for a typical Sprite
# Pro + CR Touch mount -- measure your own printer and correct them.
# Do NOT set z_offset by hand; delete the line if present and run
# PROBE_CALIBRATE after everything else is tuned, then SAVE_CONFIG.

[safe_z_home]
# Center of the bed, adjusted so a probe move keeps the probe (not just the
# nozzle) over the print area. Re-check after you correct x_offset/y_offset.
home_xy_position: 117, 117
speed: 100
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 15, 25
mesh_max: 200, 200
probe_count: 5, 5
algorithm: bicubic

#####################################################################
#   Extruder / Heaters
#####################################################################

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
microsteps: 16
# Starting point for the Sprite Pro's ~3.5:1 planetary gearbox. Calibrate
# with the standard 100mm extrusion test and adjust before trusting prints.
rotation_distance: 26.359
gear_ratio: 3.5:1
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
# The Sprite Pro hotend ships with a Generic 3950 100K NTC thermistor.
# If yours reports temperatures noticeably off, switch this to your
# thermistor's actual type (e.g. "EPCOS 100K B57560G104F").
sensor_type: Generic 3950
sensor_pin: PC5
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
# Run PID_CALIBRATE HEATER=extruder TARGET=210 after everything else works
# and let SAVE_CONFIG replace the pid_* values above.

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 130
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
# Run PID_CALIBRATE HEATER=heater_bed TARGET=60 and let SAVE_CONFIG update
# the pid_* values above for your specific bed/build surface.

#####################################################################
#   Fans
#####################################################################

[fan]
# Part cooling fan -- the only MCU-controlled fan output this board exposes.
pin: PA0

# NOTE: unlike the SKR Mini E3 V3, this board does not break out a second
# MCU-controlled fan header for the hotend/heatbreak fan or a controller
# fan. On stock Creality V4.2.7 boards, the hotend fan runs straight off
# an always-on power header, not through a GPIO -- so there's nothing to
# configure here for it. If your board/clone does expose a second fan
# header wired to a GPIO, tell me which pin and I'll add a
# [heater_fan hotend_fan] section for it.

#####################################################################
#   Host / UI support (Moonraker, Mainsail/Fluidd, TFT35 in Klipper mode)
#####################################################################

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[respond]

[exclude_object]

[gcode_macro PAUSE]
description: Pause the running print
rename_existing: PAUSE_BASE
gcode:
  {% set E = printer["gcode_macro PAUSE"] %}
  {% if printer.pause_resume.is_paused %}
    {action_respond_info("Print already paused")}
  {% else %}
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    BASE_PAUSE
    G91
    G1 E-1.0 F2100
    G1 Z10 F900
    G90
  {% endif %}

[gcode_macro RESUME]
description: Resume the paused print
rename_existing: RESUME_BASE
gcode:
  {% if printer.pause_resume.is_paused %}
    G91
    G1 E1.0 F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1
    BASE_RESUME
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  G91
  G1 Z10 F900
  G90

[gcode_macro PRINT_START]
description: Called from slicer start G-code
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
  G90
  M104 S150
  M140 S{BED_TEMP}
  G28
  M190 S{BED_TEMP}
  BED_MESH_CALIBRATE
  G1 Z5 F3000
  M109 S{EXTRUDER_TEMP}
  G1 X2 Y10 F3000
  G1 Z0.28 F240
  G92 E0
  G1 Y140 E10 F1500
  G1 X2.3 F5000
  G92 E0

[gcode_macro PRINT_END]
description: Called from slicer end G-code
gcode:
  M400
  G92 E0
  G1 E-2 F2700
  G91
  G1 Z2 F3000
  G90
  G1 X5 Y220 F3000
  M106 S0
  M104 S0
  M140 S0
  M84 X Y E
